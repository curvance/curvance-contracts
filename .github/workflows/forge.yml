name: Forge test
on:
  push:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Yarn dependencies
        run: yarn install --immutable || true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - name: Install Forge dependencies
        run: forge install

      - name: Restore Forge build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            artifacts
          key: forge-build-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            forge-build-

      - name: Start Anvil fork for Monad
        shell: bash
        run: |
          anvil --fork-url ${{ secrets.MON_NODE_URI_MONAD_MAINNET }} --port 8546 --silent &

          for i in $(seq 1 30); do
            if curl -sf -X POST http://localhost:8546 -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' > /dev/null 2>&1; then
              echo "Anvil is ready"
              break
            fi
            sleep 1
          done

      - name: Run test harness (with automatic retry after delay)
        shell: bash
        run: |
          set +e

          echo "Running forge tests..."
          forge test --ffi
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Some tests failed."
            echo "Waiting 3 minutes before retrying failed tests..."
            sleep 180

            echo "Re-running failed tests..."
            forge test --rerun --ffi
            EXIT_CODE=$?
          fi

          exit $EXIT_CODE
        env:
          ETH_NODE_URI_MAINNET: ${{ secrets.ETH_NODE_URI_MAINNET }}
          ETH_NODE_URI_ARBITRUM: ${{ secrets.ETH_NODE_URI_ARBITRUM }}
          ETH_NODE_URI_OPTIMISM: ${{ secrets.ETH_NODE_URI_OPTIMISM }}
          ETH_NODE_URI_BASE: ${{ secrets.ETH_NODE_URI_BASE }}
          MON_NODE_URI_MONAD_MAINNET: http://localhost:8546

      - name: Save Forge build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            artifacts
          key: forge-build-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
