name: Forge test
on:
  push:

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.5.1

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify pinned submodules
        shell: bash
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -E '^[+-U]'; then
            echo "::error::Submodule checkout is missing, conflicted, or not at the committed gitlink SHA."
            exit 1
          fi
          if git config --file .gitmodules --get-regexp '\.branch$'; then
            echo "::error::.gitmodules must not contain branch-tracking hints; update submodule SHAs explicitly."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        id: install-foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false

      - name: Retry Foundry install after rate-limit delay
        if: steps.install-foundry.outcome != 'success'
        shell: bash
        run: sleep 60

      - name: Install Foundry retry
        if: steps.install-foundry.outcome != 'success'
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false

      - name: Verify Foundry toolchain
        run: |
          forge --version
          cast --version
          anvil --version

      - name: Restore Forge build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            cache
            artifacts
          key: forge-build-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            forge-build-

      - name: Restore Foundry RPC cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ runner.os }}-${{ hashFiles('**/*.t.sol') }}
          restore-keys: |
            foundry-rpc-${{ runner.os }}-

      - name: Run test harness (with automatic retry after delay)
        shell: bash
        run: |
          set +e

          echo "Running forge tests..."
          forge test --ffi
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Some tests failed."
            echo "Waiting 3 minutes before retrying failed tests..."
            sleep 180

            echo "Re-running failed tests..."
            forge test --rerun --ffi
            EXIT_CODE=$?
          fi

          exit $EXIT_CODE
        env:
          ETH_NODE_URI_MAINNET: ${{ secrets.ETH_NODE_URI_MAINNET }}
          ETH_NODE_URI_ARBITRUM: ${{ secrets.ETH_NODE_URI_ARBITRUM }}
          ETH_NODE_URI_OPTIMISM: ${{ secrets.ETH_NODE_URI_OPTIMISM }}
          ETH_NODE_URI_BASE: ${{ secrets.ETH_NODE_URI_BASE }}
          MON_NODE_URI_MONAD_MAINNET: ${{ secrets.MON_NODE_URI_MONAD_MAINNET }}
          MON_NODE_URI_MONAD_ARCHIVE: ${{ secrets.MON_NODE_URI_MONAD_ARCHIVE }}

      - name: Save Forge build cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            cache
            artifacts
          key: forge-build-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}

      - name: Save Foundry RPC cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ runner.os }}-${{ hashFiles('**/*.t.sol') }}
