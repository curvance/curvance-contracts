name: Forge test
on:
  push:

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.5.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify pinned submodules
        shell: bash
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -E '^[+-U]'; then
            echo "::error::Submodule checkout is missing, conflicted, or not at the committed gitlink SHA."
            exit 1
          fi
          if git config --file .gitmodules --get-regexp '\.branch$'; then
            echo "::error::Root .gitmodules must not contain branch-tracking hints; update submodule SHAs explicitly."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Restore pnpm store cache
        id: pnpm-store-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install pnpm dependencies
        run: corepack pnpm install --frozen-lockfile --store-dir .pnpm-store

      - name: Save pnpm store cache
        if: success() && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

      - name: Install Foundry
        id: install-foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false

      - name: Retry Foundry install after rate-limit delay
        if: steps.install-foundry.outcome != 'success'
        shell: bash
        run: sleep 60

      - name: Install Foundry retry
        if: steps.install-foundry.outcome != 'success'
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false

      - name: Verify Foundry toolchain
        run: |
          forge --version
          cast --version
          anvil --version

      - name: Restore Forge build cache
        id: forge-build-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            cache
            artifacts
          key: forge-build-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'foundry.lock', 'contracts/**/*.sol', 'tests/**/*.sol', 'script/**/*.sol', 'lib/**/*.sol') }}

      - name: Restore Foundry RPC cache
        id: foundry-rpc-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml', 'tests/**/*.sol') }}

      - name: Run test harness (with automatic retry after delay)
        shell: bash
        run: |
          set +e

          echo "Running forge tests..."
          forge test --ffi
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Some tests failed."
            echo "Waiting 3 minutes before retrying failed tests..."
            sleep 180

            echo "Re-running failed tests..."
            forge test --rerun --ffi
            EXIT_CODE=$?
          fi

          exit $EXIT_CODE
        env:
          ETH_NODE_URI_MAINNET: ${{ secrets.ETH_NODE_URI_MAINNET }}
          ETH_NODE_URI_ARBITRUM: ${{ secrets.ETH_NODE_URI_ARBITRUM }}
          ETH_NODE_URI_OPTIMISM: ${{ secrets.ETH_NODE_URI_OPTIMISM }}
          ETH_NODE_URI_BASE: ${{ secrets.ETH_NODE_URI_BASE }}
          MON_NODE_URI_MONAD_MAINNET: ${{ secrets.MON_NODE_URI_MONAD_MAINNET }}
          MON_NODE_URI_MONAD_ARCHIVE: ${{ secrets.MON_NODE_URI_MONAD_ARCHIVE }}

      - name: Save Forge build cache
        if: success() && steps.forge-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            cache
            artifacts
          key: ${{ steps.forge-build-cache.outputs.cache-primary-key }}

      - name: Save Foundry RPC cache
        if: success() && steps.foundry-rpc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.foundry/cache/rpc
          key: ${{ steps.foundry-rpc-cache.outputs.cache-primary-key }}
