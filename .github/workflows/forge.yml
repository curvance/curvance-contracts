name: Forge test
on:
  push:

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.5.1

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Yarn dependencies
        run: yarn install --immutable || true

      - name: Install Foundry
        id: install-foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false

      - name: Retry Foundry install after rate-limit delay
        if: steps.install-foundry.outcome != 'success'
        shell: bash
        run: sleep 60

      - name: Install Foundry retry
        if: steps.install-foundry.outcome != 'success'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false

      - name: Verify Foundry toolchain
        run: |
          forge --version
          cast --version
          anvil --version

      - name: Install Forge dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if forge install; then
              exit 0
            fi
            echo "forge install failed on attempt ${attempt}; retrying after delay..."
            sleep $((attempt * 30))
          done
          forge install

      - name: Restore Forge build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            artifacts
          key: forge-build-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            forge-build-

      - name: Restore Foundry RPC cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ runner.os }}-${{ hashFiles('**/*.t.sol') }}
          restore-keys: |
            foundry-rpc-${{ runner.os }}-

      - name: Run test harness (with automatic retry after delay)
        shell: bash
        run: |
          set +e

          echo "Running forge tests..."
          forge test --ffi
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Some tests failed."
            echo "Waiting 3 minutes before retrying failed tests..."
            sleep 180

            echo "Re-running failed tests..."
            forge test --rerun --ffi
            EXIT_CODE=$?
          fi

          exit $EXIT_CODE
        env:
          ETH_NODE_URI_MAINNET: ${{ secrets.ETH_NODE_URI_MAINNET }}
          ETH_NODE_URI_ARBITRUM: ${{ secrets.ETH_NODE_URI_ARBITRUM }}
          ETH_NODE_URI_OPTIMISM: ${{ secrets.ETH_NODE_URI_OPTIMISM }}
          ETH_NODE_URI_BASE: ${{ secrets.ETH_NODE_URI_BASE }}
          MON_NODE_URI_MONAD_MAINNET: ${{ secrets.MON_NODE_URI_MONAD_MAINNET }}
          MON_NODE_URI_MONAD_ARCHIVE: ${{ secrets.MON_NODE_URI_MONAD_ARCHIVE }}

      - name: Save Forge build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            artifacts
          key: forge-build-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}

      - name: Save Foundry RPC cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ runner.os }}-${{ hashFiles('**/*.t.sol') }}
