[profile.default]

# The source directory
src = 'contracts'

# The test directory
test = 'tests'

# The artifact directory
out = 'artifacts'

# The fs permission
fs_permissions = [{ access = "read-write", path = "./" }]

# ignore_warnings
# 9302 - Unused low level call return data
# 1878 - Did not set license type for contract
# 5574 - Getting close to contract limit
ignored_error_codes = [9302, 1878, 5574]
ignored_warnings_from = ["tests", "script", "lib", "node_modules"]

# Sets the concrete solc version to use
# This overrides the `auto_detect_solc` value
solc_version = '0.8.26'
evm_version = 'cancun'
auto_detect_solc = false

optimizer = true
optimizer_runs = 200

# TODO: Remove this once tests are fixed
allow_internal_expect_revert = true

# Suppress common linting notes
[lint]
# Disable specific lint rules to reduce noise
exclude_lints = [
    "screaming-snake-case-const",
    "screaming-snake-case-immutable", 
    "mixed-case-variable",
    "mixed-case-function",
    "pascal-case-struct",
    "asm-keccak256",
    "divide-before-multiply",
    "incorrect-shift"
]
